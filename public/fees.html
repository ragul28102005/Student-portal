<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Fees - Student Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      min-height: 100vh;
    }

    .header {
      background: #0b1f3a;
      color: white;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 22px;
    }

    .back-button {
      text-decoration: none;
      color: white;
      background: #2563eb;
      padding: 10px 18px;
      border-radius: 7px;
      font-size: 14px;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 30px auto;
    }

    .student-info {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      border: 1px solid #e1e5eb;
    }

    .student-info h2 {
      margin-bottom: 12px;
      color: #0b1f3a;
    }

    .student-info p {
      margin: 6px 0;
    }

    .fees-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }

    .fee-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #e1e5eb;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
    }

    .fee-card h3 {
      color: #555;
      margin-bottom: 12px;
      font-size: 16px;
    }

    .fee-card p {
      font-size: 28px;
      font-weight: bold;
      color: #0b1f3a;
    }

    .details-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #e1e5eb;
    }

    .details-card h2 {
      margin-bottom: 20px;
      color: #0b1f3a;
    }

    .fee-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 5px;
      border-bottom: 1px solid #e5e7eb;
    }

    .fee-row:last-child {
      border-bottom: none;
    }

    .fee-row span {
      color: #555;
    }

    .fee-row strong {
      color: #111827;
    }

    .status {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    .message {
      display: none;
      background: white;
      border: 1px solid #e1e5eb;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {

      .fees-grid {
        grid-template-columns: 1fr;
      }

      .container {
        width: 94%;
      }

      .header {
        padding: 15px;
      }

      .fee-row {
        gap: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header class="header">

    <h1>My Fees</h1>

    <a href="/dashboard.html" class="back-button">
      ← Back to Dashboard
    </a>

  </header>


  <main class="container">

    <!-- Student Information -->
    <section class="student-info">

      <h2>Student Information</h2>

      <p>
        <strong>Name:</strong>
        <span id="studentName">Loading...</span>
      </p>

      <p>
        <strong>Register Number:</strong>
        <span id="studentRegisterNo">Loading...</span>
      </p>

      <p>
        <strong>Department:</strong>
        <span id="studentDepartment">Loading...</span>
      </p>

      <p>
        <strong>Year:</strong>
        <span id="studentYear">Loading...</span>
      </p>

    </section>


    <!-- Message -->
    <div id="feesMessage" class="message"></div>


    <!-- Fee Summary -->
    <section class="fees-grid">

      <div class="fee-card">

        <h3>Total Fees</h3>

        <p id="totalFees">
          ₹0
        </p>

      </div>


      <div class="fee-card">

        <h3>Paid Fees</h3>

        <p id="paidFees">
          ₹0
        </p>

      </div>


      <div class="fee-card">

        <h3>Pending Fees</h3>

        <p id="pendingFees">
          ₹0
        </p>

      </div>

    </section>


    <!-- Detailed Fees -->
    <section class="details-card">

      <h2>Fee Details</h2>


      <div class="fee-row">

        <span>Tuition Fee</span>

        <strong id="tuitionFee">
          ₹0
        </strong>

      </div>


      <div class="fee-row">

        <span>Tuition Status</span>

        <strong id="tuitionStatus">
          -
        </strong>

      </div>


      <div class="fee-row">

        <span>Exam Fee</span>

        <strong id="examFee">
          ₹0
        </strong>

      </div>


      <div class="fee-row">

        <span>Exam Status</span>

        <strong id="examStatus">
          -
        </strong>

      </div>


      <div class="fee-row">

        <span>Hostel Fee</span>

        <strong id="hostelFee">
          ₹0
        </strong>

      </div>


      <div class="fee-row">

        <span>Hostel Status</span>

        <strong id="hostelStatus">
          -
        </strong>

      </div>

    </section>

  </main>


  <script>

    // ============================================================
    // LOAD STUDENT FEES
    // ============================================================

    async function loadStudentFees() {

      let studentFromStorage = null;

      try {

        studentFromStorage = JSON.parse(
          sessionStorage.getItem("student") ||
          localStorage.getItem("student") ||
          "null"
        );

      } catch (error) {

        console.error(
          "Student storage error:",
          error
        );

      }


      // Check login
      if (
        !studentFromStorage ||
        !studentFromStorage.registerNo
      ) {

        alert("Please log in again.");

        window.location.href = "/";

        return;

      }


      const registerNo =
        studentFromStorage.registerNo;


      try {

        // --------------------------------------------------------
        // Get student profile
        // --------------------------------------------------------

        const studentResponse =
          await fetch(
            "/api/student/" +
            encodeURIComponent(registerNo)
          );


        const studentResult =
          await studentResponse.json();


        if (
          !studentResponse.ok ||
          !studentResult.success ||
          !studentResult.student
        ) {

          throw new Error(
            studentResult.message ||
            "Unable to load student details."
          );

        }


        const student =
          studentResult.student;


        // Display student information

        document.getElementById(
          "studentName"
        ).textContent =
          student.name || "N/A";


        document.getElementById(
          "studentRegisterNo"
        ).textContent =
          student.registerNo || registerNo;


        document.getElementById(
          "studentDepartment"
        ).textContent =
          student.department || "N/A";


        document.getElementById(
          "studentYear"
        ).textContent =
          student.year || "N/A";


        // --------------------------------------------------------
        // Get fees
        // --------------------------------------------------------

        const feesResponse =
          await fetch(
            "/api/student/" +
            encodeURIComponent(registerNo) +
            "/fees"
          );


        const feesResult =
          await feesResponse.json();


        if (
          !feesResponse.ok ||
          !feesResult.success
        ) {

          throw new Error(
            feesResult.message ||
            "Unable to load fees."
          );

        }


        const fees =
          feesResult.fees;


        // No fee record

        if (!fees) {

          const message =
            document.getElementById(
              "feesMessage"
            );

          message.textContent =
            "No fee details are available for this student.";

          message.style.display =
            "block";

          return;

        }


        // Hide message

        document.getElementById(
          "feesMessage"
        ).style.display =
          "none";


        // --------------------------------------------------------
        // Display fees
        // --------------------------------------------------------

        document.getElementById(
          "totalFees"
        ).textContent =
          formatCurrency(fees.total_fees);


        document.getElementById(
          "paidFees"
        ).textContent =
          formatCurrency(fees.paid_fees);


        document.getElementById(
          "pendingFees"
        ).textContent =
          formatCurrency(fees.pending_fees);


        document.getElementById(
          "tuitionFee"
        ).textContent =
          formatCurrency(fees.tuition_fee);


        document.getElementById(
          "tuitionStatus"
        ).textContent =
          fees.tuition_status || "-";


        document.getElementById(
          "examFee"
        ).textContent =
          formatCurrency(fees.exam_fee);


        document.getElementById(
          "examStatus"
        ).textContent =
          fees.exam_status || "-";


        document.getElementById(
          "hostelFee"
        ).textContent =
          formatCurrency(fees.hostel_fee);


        document.getElementById(
          "hostelStatus"
        ).textContent =
          fees.hostel_status || "-";


      } catch (error) {

        console.error(
          "Fees loading error:",
          error
        );


        const message =
          document.getElementById(
            "feesMessage"
          );


        message.textContent =
          error.message ||
          "Unable to load fee details.";


        message.style.display =
          "block";

      }

    }


    // ============================================================
    // FORMAT CURRENCY
    // ============================================================

    function formatCurrency(value) {

      return "₹" +
        Number(value || 0)
          .toLocaleString("en-IN");

    }


    // ============================================================
    // START
    // ============================================================

    document.addEventListener(
      "DOMContentLoaded",
      loadStudentFees
    );

  </script>

</body>

</html>
